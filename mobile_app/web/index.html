<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>mobile_app</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>

<script>
  let hlsPlayer;

  window.initializeHlsPlayer = function (videoUrl, video) {
    if (!video) {
      console.error('Video element was not passed to initializeHlsPlayer!');
      return;
    }

    console.log('Initializing HLS player:', videoUrl);

    if (hlsPlayer) {
      hlsPlayer.destroy();
      hlsPlayer = null;
    }

    if (Hls.isSupported()) {
      hlsPlayer = new Hls({
        debug: false,
        enableWorker: true,
      });

      
hlsPlayer.on(Hls.Events.ERROR, function (event, data) {
  console.error('HLS Error:', data.type, data.details);

  if (data.fatal) {
    switch (data.type) {
      case Hls.ErrorTypes.NETWORK_ERROR:
        hlsPlayer.startLoad();
        break;

      case Hls.ErrorTypes.MEDIA_ERROR:
        hlsPlayer.recoverMediaError();
        break;

      default:
        hlsPlayer.destroy();
        hlsPlayer = null;
        break;
    }
  }
});

hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
  console.log('HLS manifest loaded successfully!');

  video.play().catch(function (error) {
    console.warn('Autoplay prevented:', error);
  });
});

hlsPlayer.loadSource(videoUrl);
hlsPlayer.attachMedia(video);


    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      console.log('Using native HLS support');


video.src = videoUrl;

video.addEventListener('loadedmetadata', function () {
  video.play().catch(function (error) {
    console.warn('Autoplay prevented:', error);
  });
});


    } else {
      console.error('HLS is not supported in this browser!');
    }
  };

  window.disposeHlsPlayer = function () {
    if (hlsPlayer) {
      hlsPlayer.destroy();
      hlsPlayer = null;
    }
  };

</script>


</body>

</html>
